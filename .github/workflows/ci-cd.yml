name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  PYTHON_VERSION: 3.12
  REGISTRY: ghcr.io
  IMAGE_NAME: concrete-strength-predictor

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black isort flake8
    
    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 concrete/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 concrete/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: Format check with black
      run: |
        black --check concrete/ tests/ || echo "Black formatting issues found"
    
    - name: Import sorting check with isort
      run: |
        isort --check-only concrete/ tests/ || echo "Import sorting issues found"
    
    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --tb=short
      continue-on-error: false
    
    - name: Test data loading
      run: |
        python -c "
        from concrete.data_loader import ConcreteDataLoader
        loader = ConcreteDataLoader()
        X_train, X_val, X_test, y_train, y_val, y_test = loader.load_and_prepare_data()
        print(f'✅ Data loading test passed: {X_train.shape}, {X_val.shape}, {X_test.shape}')
        "
    
    - name: Test model training
      run: |
        python test_system.py

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Run safety check
      run: |
        pip freeze | safety check --stdin || echo "Safety check completed with warnings"
    
    - name: Run bandit security check
      run: |
        bandit -r concrete/ -f json -o bandit-report.json || echo "Bandit check completed"
    
    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: bandit-report.json

  docker:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor:latest
          ${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor:v${{ github.run_number }}
        labels: |
          org.opencontainers.image.description=Concrete Strength Predictor ML Application
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker image locally
      run: |
        docker run --rm -d -p 8501:8501 --name test-app ${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor:latest
        sleep 30
        curl --fail http://localhost:8501/_stcore/health || exit 1
        docker stop test-app

  deploy:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy notification
      run: |
        echo "🚀 Docker image successfully built and pushed to Docker Hub!"
        echo "✅ Image tags:"
        echo "   - ${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor:latest"
        echo "   - ${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor:v${{ github.run_number }}"
        echo "✅ All tests passed"
        echo "✅ Security scans completed"
        echo "✅ Container health checks passed"
        echo "✅ Docker Hub deployment successful"
        echo ""
        echo "🎯 Your image is now available for deployment to:"
        echo "- AWS ECS/Fargate: docker pull ${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor:latest"
        echo "- Google Cloud Run: docker pull ${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor:latest"
        echo "- Azure Container Instances: docker pull ${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor:latest"
        echo "- Kubernetes cluster: docker pull ${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor:latest"
        echo "- Any Docker-compatible platform"
        echo ""
        echo "� Docker Hub URL: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor"

  docker-staging:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image (staging)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor:staging
          ${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor:dev-${{ github.sha }}
        labels: |
          org.opencontainers.image.description=Concrete Strength Predictor ML Application (Staging)
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker image
      run: |
        docker run --rm -d -p 8501:8501 --name test-staging-app ${{ secrets.DOCKER_USERNAME }}/concrete-strength-predictor:staging
        sleep 30
        curl --fail http://localhost:8501/_stcore/health || exit 1
        docker stop test-staging-app
