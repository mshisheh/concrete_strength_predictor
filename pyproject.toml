[tool.poetry]
name = "concrete-strength-predictor"
version = "0.1.0"
description = "Professional ML project for predicting concrete compressive strength using UCI dataset"
authors = ["Developer <dev@example.com>"]
readme = "README.md"
packages = [{include = "concrete"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.9.7 || >3.9.7,<4.0"
streamlit = "^1.28.0"
plotly = "^5.17.0"
mlflow = "^2.8.0"
scikit-learn = "^1.3.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
pandas = "^2.1.0"
numpy = "^1.24.0"
requests = "^2.31.0"
joblib = "^1.3.0"
# For Excel file support
xlrd = "^2.0.1"
openpyxl = "^3.1.0"
# Optional: For Kaggle data downloads
kaggle = { version = "^1.5.16", optional = true }
# Optional: For additional visualization libraries
shap = { version = "^0.42.0", optional = true }

[tool.poetry.extras]
kaggle = ["kaggle"]
viz = ["shap"]
all = ["kaggle", "shap"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
pre-commit = "^3.4.0"

[tool.poetry.scripts]
concrete-predict = "concrete.app:main"
concrete-train = "concrete.trainer:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=concrete --cov-report=html --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
